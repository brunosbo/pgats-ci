# CI de Nível 01 - Disparo Manual atraves de clique
    
    # nome da pipeline
    name: 'Execucao manual'

    # gatilhos / triggers - regras de disparo

    # gatilho manual
    on:
        workflow_dispatch:

    jobs:

        # nome do job

       e2e-tests:
        # maquina onde o job vai rodar
        runs-on: ubuntu-latest


        # passos do job

        steps:

            # clone do projeto
            - uses: actions/checkout@v4

            # instalacao do node
            - uses: actions/setup-node@v4
              with:
                node-version: 24.x

            # instalacao do yarn
            - name: Instalando yarn
              run: npm install -g yarn  
            
            # instalacao das dependencias
            - name: Instalando dependencias
              run: yarn 
            
            # instalacao dos browsers do Playwright
            - name: Instalando browsers do Playwright
              run: yarn playwright install

            # executar os testes e2e
            - name: Executando testes e2e
              run: yarn run e2e