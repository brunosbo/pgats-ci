# CI de Nível 02 - Execucao agendada

# nome da pipeline
name: "Execução agendada"

# gatilhos / triggers - regras de disparo
on:
  schedule:
    # cronograma de execucao
    # 1- minuto, 2- hora , 3- dia do mes, 4- mes, 5- dia da semana
    - cron: '35 9 * * 6' # runs at 09:35, only on Saturday

# tarefas dentro da pipeline = jobs
jobs:
  # nome do job
  e2e-tests:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      # instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalação do Yarn
      - name: Instalando Yarn
        run: npm install -g yarn
            
      # instalação das dependências
      - name: Instalando dependências
        run: yarn
            
      # instalação dos Browsers do Playwright
      - name: Instalando Browsers do Playwright
        run: yarn playwright install
            
      # executar os testes e2e
      - name: Executando testes e2e
        run: yarn run e2e